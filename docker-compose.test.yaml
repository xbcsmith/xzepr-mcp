# Docker Compose for XZepr MCP Test Infrastructure
#
# Provides ephemeral test services including Keycloak for OIDC/JWT testing
# and mock XZepr API endpoints. Used for integration and E2E testing.
#
# Usage:
#   docker-compose -f docker-compose.test.yaml up -d
#   docker-compose -f docker-compose.test.yaml down -v

version: '3.8'

services:
  # PostgreSQL database for Keycloak
  postgres:
    image: postgres:15-alpine
    container_name: xzepr-mcp-test-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Keycloak for OIDC/JWT authentication testing
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: xzepr-mcp-test-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_test_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_test_password
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./tests/fixtures/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - test-network

  # Mock XZepr API server using wiremock
  xzepr-mock:
    image: wiremock/wiremock:3.3.1
    container_name: xzepr-mcp-test-xzepr
    command:
      - --global-response-templating
      - --verbose
    ports:
      - "8081:8080"
    volumes:
      - ./tests/fixtures/wiremock/mappings:/home/wiremock/mappings:ro
      - ./tests/fixtures/wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # OpenTelemetry Collector (optional, for observability testing)
  otel-collector:
    image: otel/opentelemetry-collector:0.91.0
    container_name: xzepr-mcp-test-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    volumes:
      - ./tests/fixtures/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network
    profiles:
      - observability

  # Jaeger for distributed tracing (optional)
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: xzepr-mcp-test-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Jaeger collector HTTP
      - "14250:14250" # Jaeger collector gRPC
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network
    profiles:
      - observability

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: xzepr-mcp-test-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./tests/fixtures/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network
    profiles:
      - observability

  # Redis for rate limiting and caching tests
  redis:
    image: redis:7-alpine
    container_name: xzepr-mcp-test-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network
    profiles:
      - cache

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Health check endpoint for the entire test infrastructure
# Run: docker-compose -f docker-compose.test.yaml ps
# All services should show "healthy" status before running tests
